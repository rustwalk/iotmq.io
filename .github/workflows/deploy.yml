name: Deploy iotmq.io to GitHub Pages
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola

      - name: build
        run: zola build

      - name: html
        run: |
          find public/docs -name "index.html" | while read -r index_file; do
            dir=$(dirname "$index_file")
            parent_dir=$(dirname "$dir")
            base_name=$(basename "$dir")

            if [ "$base_name" == "public" ] || [ "$base_name" == "docs" ]; then
              continue
            fi

            grandparent_dir=$(basename "$parent_dir")
            if [ "$grandparent_dir" == "docs" ]; then
              continue
            fi

            echo "$index_file"
            mv -f "$index_file" "${parent_dir}/${base_name}.html"
            rmdir "$dir"
          done

      - name: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4