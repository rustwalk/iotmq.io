{% extends "base.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-screen">
    <h1 class="font-black text-indigo-600 text-9xl animate-bounce">
        404
    </h1>

    <div class="max-w-md text-center mt-8 space-y-2">
        <p class="text-slate-500 text-sm md:text-base leading-relaxed">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        <p class="text-slate-400 text-xs md:text-sm">
            您访问的页面可能已被删除、更名或暂时不可用。
        </p>
    </div>

    <div class="flex flex-col sm:flex-row gap-4 mt-10">
        <a href="/"
           class="flex items-center justify-center px-6 py-3 bg-indigo-600 text-white rounded-2xl font-semibold hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200">
            <span>Back to Home / 返回首页</span>
        </a>

        <button onclick="history.back()"
                class="flex items-center justify-center px-6 py-3 border border-slate-300 text-slate-600 rounded-2xl font-semibold hover:bg-slate-100 transition-all cursor-pointer">
            Go Back / 返回上一页
        </button>
    </div>
</div>
{% endblock content %}
